[platformio]
default_envs = esp32-c3-super-mini

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 9600
build_flags =
    -DDISPLAY_SSD1306
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.4
	esp32async/AsyncTCP@^3.4.10
    esp32async/ESPAsyncWebServer@^3.9.6
    aki237/Adafruit_ESP32_SH1106@^1.0.2

[env:esp32-c3-super-mini]
platform = espressif32
framework = arduino
board = esp32-c3-devkitc-02
board_upload.maximum_ram_size = 409600
; Single-app built in partition
board_build.partitions = huge_app.csv
monitor_speed = 9600
build_flags = 
    -DDISPLAY_SSD1306
	-DARDUINO_USB_MODE
	-DARDUINO_USB_CDC_ON_BOOT
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.4
	esp32async/AsyncTCP@^3.4.10
    esp32async/ESPAsyncWebServer@^3.9.6
    aki237/Adafruit_ESP32_SH1106@^1.0.2

[env:esp32-c3-devkitm-1]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 9600
build_flags = 
    -DDISPLAY_SSD1306
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.4
	esp32async/AsyncTCP@^3.4.10
    esp32async/ESPAsyncWebServer@^3.9.6
    aki237/Adafruit_ESP32_SH1106@^1.0.2